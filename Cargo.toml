[workspace]
members = ["crates/asr-core", "crates/asr-cli", "crates/asr-desktop"]
default-members = ["crates/asr-cli", "crates/asr-desktop"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
anyhow = "1.0"
burn = { version = "=0.21.0", default-features = false, features = ["std", "wgpu", "ndarray", "fusion"] }
burn-wgpu = "=0.21.0"
burn-fusion = "=0.21.0"
cubecl = { version = "=0.10.0", default-features = false, features = ["std", "wgpu"] }
clap = { version = "4.5", features = ["derive"] }
cpal = "0.16"
half = "2.7"
hound = "3.5"
rustfft = "6.4"
safetensors = "0.7"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-software", "compat-1-2"] }
slint-build = "=1.18.1"
rfd = "0.15"

[profile.release]
opt-level = 3
lto = false
codegen-units = 64

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Keep GPU backend iteration practical: shader arithmetic is compiled separately by CubeCL.
[profile.fast]
inherits = "release"
opt-level = 1
lto = false
codegen-units = 64
